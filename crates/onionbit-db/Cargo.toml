[package]
name = "onionbit-db"
description = "Persistance SQLite : metadonnees de canaux/torrents (ChannelNode), sante des essaims, trackers, telechargements connus, reglages du daemon."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Shim ADR-0031 : force la compilation de l'amalgamation sqlite3mc
# et son link-search avant rusqlite/libsqlite3-sys (transitif pour
# api/core via cette dep).
onionbit-sqlite3mc = { path = "../onionbit-sqlite3mc" }
rusqlite.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
onionbit-crypto = { path = "../onionbit-crypto" }
tempfile.workspace = true
