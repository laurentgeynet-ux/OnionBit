[package]
name = "onionbit-bittorrent"
description = "Enveloppe autour du moteur BitTorrent (librqbit) : sessions de telechargement/upload, stockage des pieces, routage optionnel via le SOCKS5 des tunnels."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
librqbit.workspace = true
librqbit-core.workspace = true
# Options de socket uTP (`SocketOpts`) — plafonds de buffers par
# connexion deduits d'`EngineConfig`.
librqbit-utp.workspace = true
onionbit-format = { path = "../onionbit-format" }
onionbit-crypto = { path = "../onionbit-crypto" }
onionbit-network-policy = { path = "../onionbit-network-policy" }
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
bytes.workspace = true
hex.workspace = true
base64.workspace = true
# Forwarder UPnP UDP (`upnp.rs`) : decouverte SSDP/IGD reutilisee de
# librqbit-upnp + POST SOAP `AddPortMapping`/`DeletePortMapping` via
# reqwest ; `network-interface` resout l'IP locale du mapping.
librqbit-upnp.workspace = true
network-interface.workspace = true
reqwest.workspace = true
# `stream::unfold`/`BoxStream` — conversion du receveur de pairs e2e
# (`extra_peers_rx`) en flux consommable par la resolution magnet.
futures-util.workspace = true
# Signatures `anyhow::Result` des traits vendored `StorageFactory`/
# `TorrentStorage`/`BitVFactory` implementes par la zone privee.
anyhow = "1"
async-trait = "0.1"

[dev-dependencies]
tempfile.workspace = true
onionbit-tunnel = { path = "../onionbit-tunnel" }
onionbit-ipv8 = { path = "../onionbit-ipv8" }
# Socket UDP injectable au noeud DHT de l'exemple d'interop (le
# bootstrap DHT exige au moins une adresse — on bootstrap le noeud
# local sur lui-meme).
librqbit-dualstack-sockets = "0.7"
tracing-subscriber.workspace = true
