[package]
name = "tribler-cli"
description = "Outil de pilotage en ligne de commande du daemon, via tribler-api (REST/SSE)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "tribler-cli"
path = "src/main.rs"

[dependencies]
clap.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
axum.workspace = true
tribler-api = { path = "../tribler-api" }
tribler-core = { path = "../tribler-core" }
tribler-format = { path = "../tribler-format" }
tempfile.workspace = true
