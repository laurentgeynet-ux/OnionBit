[package]
name = "tribler-daemon"
description = "Binaire principal : assemble tribler-core, tribler-bittorrent, tribler-ipv8, tribler-tunnel, tribler-db et tribler-api ; gere la configuration et le cycle de vie du processus."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "tribler-daemon"
path = "src/main.rs"

[dependencies]
tribler-api = { path = "../tribler-api" }
tribler-core = { path = "../tribler-core" }
tribler-bittorrent = { path = "../tribler-bittorrent" }
clap.workspace = true
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

[dev-dependencies]
reqwest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
