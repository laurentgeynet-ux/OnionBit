[package]
name = "tribler-daemon"
description = "Binaire principal : assemble tribler-core, tribler-bittorrent, tribler-ipv8, tribler-tunnel, tribler-db et tribler-api ; gere la configuration et le cycle de vie du processus."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "tribler-daemon"
path = "src/main.rs"

[dependencies]
tribler-api = { path = "../tribler-api" }
tribler-core = { path = "../tribler-core" }
tribler-bittorrent = { path = "../tribler-bittorrent" }
clap.workspace = true
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

# Bureau Windows : icone de notification (tray), cle Run d'autostart,
# rattachement de la console parente (--console), mutex d'instance
# unique et pompe de messages Win32 du thread tray.
[target.'cfg(windows)'.dependencies]
tray-icon.workspace = true
winreg.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }

# Icône tribler.ico embarquée dans tribler-daemon.exe (resources.rc) —
# sert aussi d'icône de fichier pour l'exe dans l'explorateur.
[target.'cfg(windows)'.build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
reqwest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tribler-test-support = { path = "../tribler-test-support" }

