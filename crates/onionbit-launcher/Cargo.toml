[package]
name = "onionbit-launcher"
description = "Mini-lanceur portable du bundle Windows : copie a la racine sous trois noms (OnionBit, OnionBit Daemon, OnionBit Web), il resout windows\\<cible> relativement a sa propre position — remplace les .lnk a chemins absolus."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "onionbit-launcher"
path = "src/main.rs"

[dependencies]
# Verification `OBUP` au swap de mise a jour (ADR-0032 etape 144) —
# la seconde porte de confiance, independante du daemon.
onionbit-format = { path = "../onionbit-format" }
onionbit-crypto = { path = "../onionbit-crypto" }

# MessageBox d'erreur quand la cible est introuvable (sous-systeme GUI :
# sans lui un echec de lancement serait invisible). Threading+Foundation
# : sonde du mutex d'instance unique avant le swap de mise a jour.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

# Tests du swap OBUP : bundles factices signes en tempdir.
[dev-dependencies]
tempfile.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true

# Icone OnionBit embarquee dans l'exe (resources.rc) — sert d'icone de
# fichier pour les trois copies a la racine du bundle.
[target.'cfg(windows)'.build-dependencies]
embed-resource.workspace = true
