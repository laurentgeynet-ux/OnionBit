[package]
name = "onionbit-api"
description = "Plan de controle REST + SSE (axum) du daemon Tribler Rust. Parite fonctionnelle avec tribler.core.restapi ; seule porte d'entree reseau locale."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
onionbit-core = { path = "../onionbit-core" }
onionbit-bittorrent = { path = "../onionbit-bittorrent" }
onionbit-crypto = { path = "../onionbit-crypto" }
onionbit-db = { path = "../onionbit-db" }
onionbit-format = { path = "../onionbit-format" }
onionbit-ipv8 = { path = "../onionbit-ipv8" }
onionbit-tunnel = { path = "../onionbit-tunnel" }
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures-util.workspace = true
fs2.workspace = true
librqbit.workspace = true
rusqlite.workspace = true
uuid.workspace = true
tokio-stream = { version = "0.1", features = ["sync"] }
hex.workspace = true
base64.workspace = true

[dev-dependencies]
onionbit-test-support = { path = "../onionbit-test-support" }

tempfile.workspace = true
reqwest = { version = "0.13", features = ["json"] }
tokio-tungstenite.workspace = true
