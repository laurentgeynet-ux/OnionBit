[package]
name = "onionbit-api"
description = "Plan de controle REST + SSE (axum) du daemon OnionBit. Parite fonctionnelle avec tribler.core.restapi ; seule porte d'entree reseau locale."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
onionbit-core = { path = "../onionbit-core" }
onionbit-bittorrent = { path = "../onionbit-bittorrent" }
onionbit-crypto = { path = "../onionbit-crypto" }
onionbit-db = { path = "../onionbit-db" }
onionbit-format = { path = "../onionbit-format" }
onionbit-ipv8 = { path = "../onionbit-ipv8" }
onionbit-tunnel = { path = "../onionbit-tunnel" }
# Types Tor (ADR-0028) — la feature `tor` reste portee par
# onionbit-core/daemon ; l'API manipule le runtime en stub ou reel
# de la meme facon.
onionbit-tor = { path = "../onionbit-tor" }
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures-util.workspace = true
fs2.workspace = true
subtle.workspace = true
librqbit.workspace = true
rusqlite.workspace = true
uuid.workspace = true
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http.workspace = true
hex.workspace = true
base64.workspace = true

[dev-dependencies]
onionbit-test-support = { path = "../onionbit-test-support" }
# Signatures de liaison `.onion` des tests `peer_onions` (ADR-0029).
onionbit-crypto = { path = "../onionbit-crypto" }
# Doubles `OnionSearchBackend` des tests `/api/search/external` +
# capture tracing (« aucune requete dans les logs », ADR-0028 §6).
async-trait.workspace = true
tracing-subscriber.workspace = true
# Signature `OBUP` des tests `/api/versioning/import` (ADR-0032).
ed25519-dalek.workspace = true
sha2.workspace = true

tempfile.workspace = true
reqwest = { version = "0.13", features = ["json"] }
tokio-tungstenite.workspace = true
