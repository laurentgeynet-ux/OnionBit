[package]
name = "onionbit-cli"
description = "Outil de pilotage en ligne de commande du daemon, via onionbit-api (REST/SSE)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "onionbit-cli"
path = "src/main.rs"

[dependencies]
clap.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true

# Signature `OBUP` des releases (ADR-0032 etape 142) — hors-ligne,
# aucune dependance daemon ; la clef privee n'est jamais logguee.
ed25519-dalek.workspace = true
sha2.workspace = true
zeroize.workspace = true
hex.workspace = true
rand.workspace = true
onionbit-format = { path = "../onionbit-format" }
onionbit-crypto = { path = "../onionbit-crypto" }

[dev-dependencies]
axum.workspace = true
onionbit-api = { path = "../onionbit-api" }
# `default-features = false` : le client REST n'a pas besoin du
# transport Tor de core — et sans lui la lane -NoTor resterait
# tor-free partout (unification par invocation cargo).
onionbit-core = { path = "../onionbit-core", default-features = false }
onionbit-test-support = { path = "../onionbit-test-support" }

tempfile.workspace = true
