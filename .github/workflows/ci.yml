# CI matricielle (P1) — socle de reproductibilite multi-OS.
#
# Ce qui tourne ici : checks statiques + tests workspace (loopback) +
# Flutter analyze/test + build release Windows x64. Les bancs reseau
# reel (interop pyipv8/Tribler, public, captures OS) restent locaux —
# ils exigent Tribler.exe/pyipv8 et une stack reseau non emulee.
#
# windows-11-arm : runner en preview publique — non bloquant tant que
# la disponibilite n'est pas stabilisee.

name: ci

on:
  push:
    branches: [master]
    # Un tag v* lance la matrice complete + le job `publish` en bout
    # de chaine (release GitHub avec tous les artefacts de package).
    tags: ['v*']
  pull_request:
  # Lancement manuel depuis l'onglet Actions — sert a valider le job
  # nightly sans attendre le cron (et a rejouer les bancs longs).
  workflow_dispatch:
  schedule:
    # Longevite automatisee (P1) : job nightly dedie ci-dessous.
    - cron: '0 3 * * *'

permissions: {}

defaults:
  run:
    shell: pwsh

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-11-arm
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: check
        run: cargo check --workspace --all-targets --all-features
      - name: clippy (zero warning)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: fmt
        run: cargo fmt --all -- --check
      - name: tests workspace
        run: cargo test --workspace --all-features

  flutter:
    name: flutter (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: pub get
        working-directory: app
        run: flutter pub get
      - name: analyze
        working-directory: app
        run: flutter analyze
      - name: tests
        working-directory: app
        run: flutter test
      - name: check i18n
        run: ./scripts/check_i18n.ps1

  release-windows:
    name: release build (windows x64)
    runs-on: windows-latest
    needs: [rust, flutter]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build release + manifest
        run: ./scripts/build_release.ps1 -SkipCheck
      - name: smoke daemon
        run: dist/x86_64-pc-windows-msvc/onionbit-daemon.exe --help
      - uses: actions/upload-artifact@v7
        with:
          name: onionbit-windows-x64
          path: dist/x86_64-pc-windows-msvc/

  # Packaging par plateforme : zips Windows complets (daemon + UI
  # Flutter + web/) via build_dist.ps1 ; Linux = daemon + cli + web/
  # (l'UI native Linux n'est pas encore dans le scope) en tar.gz +
  # .deb. Tous les artefacts sont recuperes par le job `publish` sur
  # tag v*.
  package-linux:
    name: "package (linux x64 : tar.gz + .deb)"
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: build interface web
        working-directory: app
        run: flutter pub get && flutter build web --release
      - name: package
        shell: bash
        run: ./scripts/package_posix.sh
      - name: smoke daemon
        shell: bash
        run: dist/x86_64-unknown-linux-gnu/onionbit-daemon --help
      - uses: actions/upload-artifact@v7
        with:
          name: onionbit-linux-x64
          path: |
            dist/OnionBit-*-linux-x64.tar.gz
            dist/onionbit_*_amd64.deb

  package-windows-x64:
    name: "package (windows x64 : zip)"
    runs-on: windows-latest
    needs: [rust, flutter]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: build dist + zip release
        run: ./scripts/build_dist.ps1 -SkipCheck -ZipRelease
      - name: smoke daemon
        run: dist/onionbit-daemon.exe --help
      - uses: actions/upload-artifact@v7
        with:
          name: onionbit-windows-x64-zip
          path: dist/OnionBit-*-windows-x64.zip

  package-windows-arm64:
    name: package (windows arm64 — zip)
    runs-on: windows-11-arm
    continue-on-error: true   # runner preview + toolchain Flutter ARM64
    needs: [rust, flutter]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          architecture: arm64
      - name: build dist + zip release
        run: ./scripts/build_dist.ps1 -SkipCheck -ZipRelease
      - name: smoke daemon
        run: dist/onionbit-daemon.exe --help
      - uses: actions/upload-artifact@v7
        with:
          name: onionbit-windows-arm64
          path: dist/OnionBit-*-windows-arm64.zip

  # Publication : uniquement sur tag v*. Telecharge tous les artefacts
  # de package et cree la release GitHub (prerelease si le tag contient
  # « alpha »/« beta »/« rc »). Le job ARM64 (preview) est attendu mais
  # non obligatoire : son echec ne bloque pas la release.
  publish:
    name: publish (release github)
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && needs.release-windows.result == 'success'
      && needs.package-linux.result == 'success'
      && needs.package-windows-x64.result == 'success'
    runs-on: ubuntu-latest
    needs: [release-windows, package-linux, package-windows-x64, package-windows-arm64]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
      - name: publier la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="${GITHUB_REF_NAME}"
          files=(onionbit-*/OnionBit-*.zip onionbit-*/OnionBit-*.tar.gz onionbit-*/onionbit_*.deb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "aucun artefact a publier" >&2; exit 1
          fi
          {
            echo "## OnionBit ${tag}"
            echo
            echo "Artifacts produced by the CI matrix — see commit history and"
            echo "\`docs/CHANGELOG.md\` for details."
            echo
            echo "### SHA-256"
            echo
            echo '```'
            for f in "${files[@]}"; do
              sha256sum "$f" | awk -v n="$(basename "$f")" '{print $1"  "n}'
            done
            echo '```'
          } > notes.md
          prerelease=""
          case "$tag" in
            *alpha*|*beta*|*rc*) prerelease="--prerelease" ;;
          esac
          gh release create "$tag" \
            --title "$tag" \
            --notes-file notes.md \
            $prerelease \
            "${files[@]}"
  # Longevite automatisee (P1) : la boucle fuzz smoke + les tests
  # longs du workspace en nightly. Le mesh fingerprint reel reste un
  # banc local (Tribler.exe/pyipv8 indisponibles sur runner).
  nightly:
    name: nightly — endurance statique
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: tests workspace (nightly)
        run: cargo test --workspace --all-features
