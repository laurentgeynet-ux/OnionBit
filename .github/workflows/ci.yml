# CI matricielle (P1) — socle de reproductibilite multi-OS.
#
# Ce qui tourne ici : checks statiques + tests workspace (loopback) +
# Flutter analyze/test + build release Windows x64. Les bancs reseau
# reel (interop pyipv8/Tribler, public, captures OS) restent locaux —
# ils exigent Tribler.exe/pyipv8 et une stack reseau non emulee.
#
# windows-11-arm : runner en preview publique — non bloquant tant que
# la disponibilite n'est pas stabilisee.

name: ci

on:
  push:
    branches: [master]
    # Un tag v* lance la matrice complete + le job `publish` en bout
    # de chaine (release GitHub avec tous les artefacts de package).
    tags: ['v*']
  pull_request:
  # Lancement manuel depuis l'onglet Actions — sert a valider le job
  # nightly sans attendre le cron (et a rejouer les bancs longs).
  workflow_dispatch:
  schedule:
    # Longevite automatisee (P1) : job nightly dedie ci-dessous.
    - cron: '0 3 * * *'

permissions: {}

defaults:
  run:
    shell: pwsh

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 epingle : `ubuntu-latest` basculera sur 26.04
        # (annonce GitHub) — epingler fige le socle et la migration
        # se fera par choix explicite avec un run de validation.
        os: [windows-latest, ubuntu-24.04, macos-latest]
        include:
          - os: windows-11-arm
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: check
        run: cargo check --workspace --all-targets --all-features
      - name: clippy (zero warning)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: fmt
        run: cargo fmt --all -- --check
      - name: tests workspace
        timeout-minutes: 45
        run: cargo test --workspace --all-features -- --skip live_
      # Banc live serialise : les 14 tests spawnent chacun relais +
      # tunnels + moteurs ; en parallele la contention CPU sur le
      # runner le plus lent (windows) ralentissait la construction de
      # circuit au point que la resolution BEP 9 des magnets depassait
      # son timeout sur 5 tests d'un coup. La serie supprime la
      # variance sans toucher aux oracles (timeouts inchanges).
      - name: live bench (serialise)
        timeout-minutes: 45
        run: >-
          cargo test -p onionbit-core --test live_bench
          -- --test-threads=1

  flutter:
    name: flutter (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: pub get
        working-directory: app
        run: flutter pub get
      - name: analyze
        working-directory: app
        run: flutter analyze
      - name: tests
        working-directory: app
        run: flutter test
      - name: check i18n
        run: ./scripts/check_i18n.ps1

  release-windows:
    name: release build (windows x64)
    runs-on: windows-latest
    needs: [rust, flutter]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build release + manifest
        run: ./scripts/build_release.ps1 -SkipCheck
      - name: smoke daemon
        run: ./dist/OnionBit/windows/onionbit-daemon.exe --help
      - uses: actions/upload-artifact@v7
        with:
          name: onionbit-windows-x64
          path: dist/OnionBit/

  # Packaging par plateforme : zips Windows complets (daemon + UI
  # Flutter + web/) via build_dist.ps1 ; Linux = daemon + cli + web/
  # (l'UI native Linux n'est pas encore dans le scope) en tar.gz +
  # .deb. Tous les artefacts sont recuperes par le job `publish` sur
  # tag v*.
  package-linux:
    name: "package (linux x64 : tar.gz + .deb)"
    runs-on: ubuntu-24.04
    needs: [rust]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: build interface web
        working-directory: app
        run: flutter pub get && flutter build web --release
      - name: package
        shell: bash
        run: ./scripts/package_posix.sh
      - name: smoke daemon
        shell: bash
        run: dist/x86_64-unknown-linux-gnu/onionbit-daemon --help
      - uses: actions/upload-artifact@v7
        with:
          name: onionbit-linux-x64
          path: |
            dist/OnionBit-*-linux-x64.tar.gz
            dist/onionbit_*_amd64.deb

  package-windows-x64:
    name: "package (windows x64 : zip)"
    runs-on: windows-latest
    needs: [rust, flutter]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: build dist + zip release
        run: ./scripts/build_dist.ps1 -SkipCheck -ZipRelease
      - name: smoke daemon
        run: ./dist/OnionBit/windows/onionbit-daemon.exe --help
      - uses: actions/upload-artifact@v7
        with:
          name: onionbit-windows-x64-zip
          path: dist/OnionBit-*-windows-x64.zip

  package-windows-arm64:
    name: "package (windows arm64 : daemon+cli)"
    runs-on: windows-11-arm
    continue-on-error: true   # runner preview
    needs: [rust]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pas d'UI Flutter ARM64 : aucune archive SDK windows_arm64
      # n'est publiee dans le manifeste officiel (x64 seulement — le
      # bundle UI complet reste produit en x64). Le daemon + cli
      # natifs suffisent pour la lane ARM64 headless ; le zip UI
      # complet ARM64 suivra quand Flutter le permettra.
      - name: build release daemon + cli
        run: ./scripts/build_release.ps1 -SkipCheck
      - name: smoke daemon
        run: ./dist/OnionBit/windows/onionbit-daemon.exe --help
      - name: zip
        run: |
          $ver = (cargo pkgid -p onionbit-daemon).Split('#')[-1]
          Compress-Archive -Path dist/OnionBit `
            -DestinationPath "dist/OnionBit-$ver-windows-arm64-headless.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: onionbit-windows-arm64
          path: dist/OnionBit-*-windows-arm64-headless.zip

  # APK Android : l'app est un client distant (pairing QR vers un
  # daemon) — pas de binaire embarque, c'est un build Flutter pur.
  # Signature : si les secrets ANDROID_* sont provisionnes, un keystore
  # + key.properties sont materialises et le build release est signe
  # avec ; sinon le job signe avec la cle debug (build installeable en
  # sideload, flaggable « debug » — a corriger en provisionnant les
  # secrets plutot qu'en figeant).
  package-android:
    name: "package (android : apk client distant)"
    runs-on: ubuntu-24.04
    needs: [flutter]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: keystore release (si secrets provisionnes)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "pas de keystore : signature debug (sideload uniquement)"
            exit 0
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/onionbit.jks"
          {
            echo "storeFile=${RUNNER_TEMP}/onionbit.jks"
            echo "storePassword=${ANDROID_KEY_STORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
          } > app/android/key.properties
      - name: build apk
        working-directory: app
        shell: bash
        run: >-
          flutter pub get &&
          flutter build apk --release --split-per-abi
      - name: renommer les artefacts
        shell: bash
        run: |
          set -euo pipefail
          ver=$(grep '^version:' app/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          mkdir -p dist/android
          for f in app/build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" | sed 's/^app-//; s/-release\.apk$//')
            cp "$f" "dist/android/OnionBit-${ver}-android-${abi}.apk"
          done
          ls -la dist/android
      - uses: actions/upload-artifact@v7
        with:
          name: onionbit-android
          path: dist/android/OnionBit-*-android-*.apk

  # Image Docker (ADR-0024, etape 94) : buildx + push ghcr.io sur tag
  # v* uniquement (les builds PR/master restent locaux — cf.
  # docs/docker.md). La variante final-webui embarque l'UI Flutter.
  docker:
    name: "docker image (ghcr.io)"
    runs-on: ubuntu-24.04
    needs: [rust]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: final-webui
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/onionbit:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/onionbit:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publication : uniquement sur tag v*. Telecharge tous les artefacts
  # de package et cree la release GitHub marquee « Latest » (les tags
  # alpha/beta sont les releases publiques du projet). Le job ARM64
  # (preview) est attendu mais non obligatoire : son echec ne bloque
  # pas la release.
  publish:
    name: publish (release github)
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && needs.release-windows.result == 'success'
      && needs.package-linux.result == 'success'
      && needs.package-windows-x64.result == 'success'
    runs-on: ubuntu-24.04
    needs: [release-windows, package-linux, package-windows-x64, package-windows-arm64, package-android]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          # L'artefact `*.dockerbuild` exporte par build-push-action
          # ne matche pas ce motif : il est parfois corrompu (zip
          # invalide) et faisait echouer le telechargement en bloc.
          pattern: onionbit-*
      - name: publier la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="${GITHUB_REF_NAME}"
          files=(onionbit-*/OnionBit-*.zip onionbit-*/OnionBit-*.tar.gz onionbit-*/onionbit_*.deb onionbit-*/OnionBit-*.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "aucun artefact a publier" >&2; exit 1
          fi
          {
            echo "## OnionBit ${tag}"
            echo
            echo "Artifacts produced by the CI matrix — see commit history and"
            echo "\`docs/CHANGELOG.md\` for details."
            echo
            echo "### SHA-256"
            echo
            echo '```'
            for f in "${files[@]}"; do
              sha256sum "$f" | awk -v n="$(basename "$f")" '{print $1"  "n}'
            done
            echo '```'
          } > notes.md
          # Les tags alpha/beta/rc restent les releases publiques du
          # projet : le suffixe `-xxx` du tag ajoute --prerelease pour
          # etiqueter honnetement le statut (badge « Pre-release », pas
          # de confusion avec une stable). GitHub refuse `--latest` sur
          # une prerelease (« Latest release cannot be draft or
          # prerelease ») : il n'est passe que pour un tag sans suffixe
          # (v0.9.0 = release stable marquee Latest).
          pre=()
          latest=(--latest)
          case "$tag" in
            *-*) pre=(--prerelease); latest=();;
          esac
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --notes-file notes.md \
            "${latest[@]}" \
            "${pre[@]}" \
            "${files[@]}"
  # Longevite automatisee (P1) : la boucle fuzz smoke + les tests
  # longs du workspace en nightly. Le mesh fingerprint reel reste un
  # banc local (Tribler.exe/pyipv8 indisponibles sur runner).
  nightly:
    name: nightly — endurance statique
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: tests workspace (nightly)
        run: cargo test --workspace --all-features -- --skip live_
      - name: live bench (serialise)
        timeout-minutes: 45
        run: >-
          cargo test -p onionbit-core --test live_bench
          -- --test-threads=1
      # Banc d'endurance live (P1) : churn de flotte + restarts sur
      # reseau loopback reel, metriques CSV (RSS/taches/circuits) en
      # artefact. 30 min par defaut ; duration configurable via env.
      - name: endurance churn (live)
        timeout-minutes: 45
        env:
          LIVE_ENDURANCE_SECS: '1800'
          # Chemin absolu depuis le workspace : le CWD d'un test cargo
          # est le dossier du crate — un chemin relatif serait resolu
          # depuis crates/onionbit-core et non la racine.
          LIVE_ENDURANCE_CSV: ${{ github.workspace }}/live_endurance.csv
        run: >-
          cargo test -p onionbit-core --test live_bench
          live_endurance_churn -- --ignored --nocapture
          *>&1 | Tee-Object -FilePath "${{ github.workspace }}/live_endurance.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-endurance-metrics
          path: |
            live_endurance.csv
            live_endurance.log
          if-no-files-found: warn

  # Sanitizers (ASan+UBSan) : impossible sous MSVC (pas de runtime
  # asan livre ; UBSan absent de la cible). Le runner Linux a les
  # runtimes rustup natifs — scripts/fuzz_asan.sh rejoue les corpus
  # instrumentes et echoue si les symboles __asan/__ubsan sont absents
  # du binaire (garde « sanitizer arme »).
  fuzz-san:
    name: nightly — fuzz ASan/UBSan (linux)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      # Budget par cible et par sanitizer ; 8 cibles x 2 sanitizers.
      FUZZ_SAN_SEC: '300'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: campagne sanitizers
        shell: bash
        timeout-minutes: 120
        run: SEC=$FUZZ_SAN_SEC ./scripts/fuzz_asan.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fuzz-san-artifacts
          path: fuzz/artifacts/
          if-no-files-found: warn
