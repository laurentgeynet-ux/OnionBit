[workspace]
resolver = "2"
members = [
    "crates/onionbit-format",
    "crates/onionbit-crypto",
    "crates/onionbit-bittorrent",
    "crates/onionbit-ipv8",
    "crates/onionbit-tunnel",
    "crates/onionbit-messaging",
    "crates/onionbit-core",
    "crates/onionbit-db",
    "crates/onionbit-sqlite3mc",
    "crates/onionbit-network-policy",
    "crates/onionbit-tor",
    "crates/onionbit-api",
    "crates/onionbit-cli",
    "crates/onionbit-daemon",
    "crates/onionbit-launcher",
    "crates/onionbit-test-support",
]
# Les crates vendored (`[patch.crates-io]`) ne sont pas des membres du
# workspace : l'exclure permet de lancer `cargo test` dans vendor/*.
exclude = [
    "fuzz",
    "vendor/librqbit",
    "vendor/librqbit-dht",
    "vendor/librqbit-dualstack-sockets",
    "vendor/librqbit-tracker-comms",
    "vendor/librqbit-utp",
]
[workspace.package]
version = "1.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Laurent Geynet (Loulach) <laurent.geynet@gmail.com>"]
repository = "https://github.com/laurentgeynet-ux/OnionBit"
rust-version = "1.80"

# NOTE: cette table de dependances partagees est preparee a l'avance (cf.
# docs/architecture/architecture.md) mais la plupart ne sont pas encore
# consommees par les crates au stade "scaffold" (etape 0). Chaque phase de
# docs/plans/roadmap.md active progressivement les dependances dont elle a
# besoin dans le Cargo.toml du crate concerne.
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "local-time"] }
tracing-appender = "0.2"
# `env` : `ONIONBIT_STATE_DIR` d'onionbit-cli (ADR-0024, etape 89) —
# active au niveau workspace, tous les consommateurs de clap la
# tirent (inoffensif).
clap = { version = "4", features = ["derive", "env"] }
# `bundled` retire (ADR-0031) : la bibliotheque `sqlite3` liee est
# fournie par `onionbit-sqlite3mc` (SQLite3 Multiple Ciphers, codec
# ChaCha20) a la place du SQLite vanilla.
rusqlite = { version = "0.40", features = ["functions"] }
# Amalgamation SQLite3 Multiple Ciphers pinnee (MIT) — compilee par
# le build.rs d'`onionbit-sqlite3mc` via `cc` (MSVC).
sqlite3mc-src = "=205.1.0"
cc = "1"
rand = "0.10"
sha1 = "0.11"
sha2 = "0.11"
# SHA3-256 — checksum des adresses de services caches Tor v3
# (`onionbit-format::onion`, ADR-0028). MIT/Apache-2.0.
sha3 = "0.10"
# Connectivite Tor embarquee (`onionbit-tor`, feature `tor`,
# ADR-0028 §1) : client Tor officiel en Rust. `rustls` evite
# OpenSSL, `tokio` est le runtime du workspace, `compression`
# (feature par defaut d'arti) permet au dirmgr d'echanger les
# documents compresses (zstd/lzma/xz), comme le client de
# reference. `onion-service-client` (tor-hsclient) est
# REQUIS pour joindre des cibles `.onion`. MIT/Apache-2.0. Tres
# lourd en build — toujours optionnel derriere le feature flag.
# `static-sqlite` RETIRE (etape 132) : il active `rusqlite/bundled`
# via `tor-dirmgr` — l'unification cargo liait alors le SQLite
# vendored A LA PLACE d'`onionbit-sqlite3mc`, rendant les pragmas
# `cipher`/`key` inertes : le daemon `--features tor` ecrivait
# `onionbit.db` EN CLAIR. Le `sqlite3` unique reste fourni par
# `onionbit-sqlite3mc` (dep `tor` d'`onionbit-tor`) et sert aussi
# au dirmgr d'arti.
arti-client = { version = "0.47", default-features = false, features = ["rustls", "tokio", "compression", "onion-service-client", "bridge-client"] }
tor-rtcompat = "0.47"
# SOCKS5 loopback (mode `external`, URL validee par
# `proxy_guard::validate_local_socks5_url`) — deja dans l'arbre
# via le librqbit vendored, promu dependance directe.
tokio-socks = "0.5"
# Decodeur HTTP/1.1 zero-allocation pour les reponses onion
# (statut, en-tetes, chunked, CRLF/LF) — jamais de parseur maison
# (ADR-0028 §1). MIT/Apache-2.0.
httparse = "1"
# Parsing borne des pages `.onion` (onionbit-tor, ADR-0028 §5) :
# html5ever/selectors — jamais de regex ni de parseur maison sur du
# HTML tiers. ISC. Hors feature `tor` : le scraping est testable
# sans transport (fetch injecte via `OnionFetch`).
scraper = "0.26"
# Traits async object-safe (`OnionFetch`, `OnionSearchBackend`).
async-trait = "0.1"
# TLS sur un flux Tor (`onionbit-tor`, ADR-0028 §5 `api_via_exit`) :
# les hotes clearnet de sortie parlent https — et un exit ne doit
# pas pouvoir reecrire des metadonnees de recherche en clair.
# `webpki-roots` embarque le bundle Mozilla (deterministe, portable
# — meme choix qu'arti). MIT/Apache-2.0, optionnels via `tor`.
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "0.26"
ed25519-dalek = "3"
x25519-dalek = { version = "3", features = ["static_secrets", "getrandom"] }
# Elligator2 (ADR-0017) : encode les points Curve25519 du handshake
# stealth en chaines indistinguables d'un tirage uniforme. Crate
# standalone sur fiat-crypto (arithmetique formellement verifiee,
# temps constant), testee differentiellement contre le fork Tor
# `curve25519-elligator2` (dev-dep, jamais embarquee). Licence
# MIT/Apache-2.0 — compatible GPL-3.0. La feature `x25519` est
# exclue : elle tirerait x25519-dalek v3 en doublon de notre v2 —
# le DH reste sur `x25519-dalek` via `secret_bytes()`.
elligator2 = "0.1"
chacha20poly1305 = "0.11"
hkdf = "0.13"
hmac = "0.13"
argon2 = "0.5"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
# Normalisation Unicode NFKD (BIP39, ADR-0016) : la spec exige NFKD
# sur la phrase saisie — macOS emet du NFD au clavier.
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.13", features = ["json"] }
tokio-tungstenite = "0.29"
tempfile = "3"
proptest = "1"
lz4_flex = "0.11"
fs2 = "0.4"
base64 = "0.23"

# API HTTPS (onionbit-daemon) : listener TLS de l'API de controle
# (`api/https_*` Python) — axum-server pour le serveur rustls,
# rustls-pemfile pour parser le PEM `https_certfile` (cert + cle dans
# le meme fichier, comme `load_cert_chain`), rcgen pour le certificat
# auto-signe genere quand le fichier est absent.
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls-pemfile = "2"
rcgen = "0.13"

# Bureau Windows (onionbit-daemon) : icone systray, cle Run d'autostart,
# console/icone executable. Version epinglee exacte pour tray-icon
# (0.25.1, 2026-09-16) : eviter de resoudre vers une version fraiche.
tray-icon = "=0.25.1"
winreg = "0.55"
windows-sys = "0.61"
embed-resource = "3"
# Detection de volume (`onionbit-core::volume`, ADR-0018) : statfs(2)
# sous macOS. libc est deja dans l'arbre via tokio/rusqlite.
libc = "0.2"

# Moteur BitTorrent reutilise (voir ADR-0001) : evite de reecrire bencode,
# protocole peer-wire, DHT BEP5 et tracker HTTP/UDP qui existent deja en
# Rust pur et sont actifs/matures.
librqbit = { version = "9", features = ["storage_examples"] }
librqbit-core = "9"
librqbit-bencode = "9"
librqbit-utp = "0.7"
# Forwarder UPnP UDP d'`onionbit-bittorrent` : decouverte SSDP et
# parsing IGD reutilises (le `AddPortMapping` de librqbit-upnp est TCP
# en dur — le mapping UDP est local a `upnp.rs`).
librqbit-upnp = "9.0.1"
network-interface = "2"

# Port Rust de libtorrent — depot officiel
# https://github.com/laurentgeynet-ux/BitDeamonRust.git
# Dependances `git` epinglees par `rev` : reproductible en CI (les
# `path = ../LibtorrentRust` de co-developpement n'existent pas sur
# les runners). L'adaptateur `storage_bitdaemon` consomme
# `file_pool`/`pread_storage`/`part_file`. Pour iterer en local sans
# cycle push/pin, utiliser `[patch]` ou un checkout a cote.
bitdaemon-common = { git = "https://github.com/laurentgeynet-ux/BitDeamonRust.git", rev = "530f560040106f802eb747787b75aa3f9abe5679" }
bitdaemon-core = { git = "https://github.com/laurentgeynet-ux/BitDeamonRust.git", rev = "530f560040106f802eb747787b75aa3f9abe5679" }
bitdaemon-disk = { git = "https://github.com/laurentgeynet-ux/BitDeamonRust.git", rev = "530f560040106f802eb747787b75aa3f9abe5679" }
bitdaemon-net = { git = "https://github.com/laurentgeynet-ux/BitDeamonRust.git", rev = "530f560040106f802eb747787b75aa3f9abe5679" }
bitdaemon-session = { git = "https://github.com/laurentgeynet-ux/BitDeamonRust.git", rev = "530f560040106f802eb747787b75aa3f9abe5679" }
bitdaemon = { git = "https://github.com/laurentgeynet-ux/BitDeamonRust.git", rev = "530f560040106f802eb747787b75aa3f9abe5679" }

# Copie vendored + patchee de librqbit 9.0.1 : les tunnels anonymes
# Tribler n'ont pas de relais TCP generique — le trafic pair anonyme doit
# passer en uTP/DHT/trackers-UDP a travers les cellules `data` du tunnel
# (cf. `ipv8-rust-tunnels` de reference). Les patches ajoutent
# l'injection de sockets UDP « tunnel » (uTP connecteur, DHT, tracker
# UDP) sans changer le comportement par defaut.
[patch.crates-io]
librqbit = { path = "vendor/librqbit" }
librqbit-dht = { path = "vendor/librqbit-dht" }
librqbit-tracker-comms = { path = "vendor/librqbit-tracker-comms" }
librqbit-dualstack-sockets = { path = "vendor/librqbit-dualstack-sockets" }
librqbit-utp = { path = "vendor/librqbit-utp" }
# Correctif bug Windows : `find_limit` boucle infiniment car
# `SystemTime::checked_sub` sature (borne FILETIME) au lieu de rendre
# None — la recherche binaire des min/max ne converge jamais.
# Cf. doc/architecture/decisions/0028 et roadmap_adr0028 (bootstrap arti
# fige a 15 %, un coeur CPU a 100 %). A retirer des qu'un correctif
# upstream est publie (arti, gitlab.torproject.org).
saturating-time = { path = "vendor/saturating-time" }

[profile.release]
opt-level = 3
lto = "thin"
