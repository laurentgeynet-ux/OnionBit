<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OnionBit — interface web du daemon BitTorrent anonyme (port Rust de Tribler).">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OnionBit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OnionBit</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // L'UI est servie en same-origin par le daemon local : le mode
    // hors-ligne d'une PWA n'a pas de sens (sans daemon, l'app est
    // inutilisable). Le service worker Flutter cache agressivement
    // le bundle et peut servir une UI périmée après une mise à
    // jour — désenregistrement immédiat puis périodique (le
    // bootstrap en ré-enregistre un au chargement de l'app).
    if ('serviceWorker' in navigator) {
      var onionbitDropSW = function () {
        navigator.serviceWorker.getRegistrations().then(function (rs) {
          rs.forEach(function (r) { r.unregister(); });
        });
      };
      onionbitDropSW();
      setInterval(onionbitDropSW, 15000);
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
