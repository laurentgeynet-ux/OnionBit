org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# kotlin.incremental=false : le projet vit sur D:\ alors que le pub
# cache Gradle est sur C:\ — le stockage incremental Kotlin échoue à
# relativiser les chemins entre lecteurs (« this and base files have
# different roots »). Bug Kotlin/Gradle connu sur Windows multi-disque ;
# sans ce flag, compileDebugKotlin des plugins échoue systématiquement.
kotlin.incremental=false
